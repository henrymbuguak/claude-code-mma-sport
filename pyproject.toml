[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mma_sport.settings"
python_files = ["test_*.py"]
testpaths = ["events", "accounts", "favorites", "intelligence"]
