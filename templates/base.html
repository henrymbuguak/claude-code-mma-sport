{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MMA Sport{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <h1 class="site-title">MMA Sport</h1>
    <nav class="account-nav" aria-label="Account">
      {% if user.is_authenticated %}
        <a href="{% url 'favorites:my_events' %}">My Events</a>
        <span class="account-nav-username">{{ user.username }}</span>
        <form class="logout-form" method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="button button--link">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
        <a href="{% url 'accounts:signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <script defer src="{% static 'js/timezone.js' %}"></script>
</body>
</html>
