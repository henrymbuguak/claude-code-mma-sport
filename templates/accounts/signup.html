{% extends "base.html" %}

{% block title %}Sign Up — MMA Sport{% endblock %}

{% block content %}
<h2>Sign Up</h2>
<form class="form" method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="button">Sign Up</button>
</form>
<p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
